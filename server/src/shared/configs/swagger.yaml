openapi: 3.0.0
info:
  title: Atomecom API Documentation
  version: 1.0.0
  description: |
    API system for the Atomecom E-commerce project.
    Built with Express, TypeScript, and MongoDB.

    ### ⚠️ Error Handling Policy
    * **Production Mode:** To ensure system security, internal Throw Errors (500) will only return a generic message: `Internal Throw Error`. No technical details or stack traces are exposed.
    * **Development Mode:** Detailed error information, including stack traces and specific error types, will be included in the response to assist in debugging.
    * **Common Status Codes:**
        * `400`: Validation error or bad request.
        * `401`: Unauthorized (missing or invalid tokens).
        * `403`: Forbidden (insufficient permissions).
        * `404`: Resource not found.
        * `409`: Conflict data.
        * `500`: System-level failure.

servers:
  - url: http://localhost:3636/v1/api
    description: Development server

tags:
  - name: Auth
    description: Operations about user authentication and registration
  - name: User
    description: Operations about user profile management

  - name: Category
    description: Operations about categories
  - name: Brand
    description: Operations about brands
  - name: Product
    description: Operations about products
  - name: Sku
    description: Operations about SKUs
  - name: Inventory
    description: Operations about inventory and stock

paths:
  # ================= AUTH MODULE =================
  /auth/register:
    post:
      summary: Register a new account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpInput'
      responses:
        '201':
          description: Successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/login:
    post:
      summary: Login to the system
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/refresh-token:
    post:
      summary: Refresh authentication tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      summary: Logout of the system
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutInput'
      responses:
        '204':
          description: Successfully logged out
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/verify-email:
    get:
      summary: Verify user email address
      tags: [Auth]
      parameters:
        - in: query
          name: token
          schema:
            type: string
          required: true
          description: Verification token sent via email
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/resend-verification:
    post:
      summary: Resend verification email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationInput'
      responses:
        '200':
          description: Verification email sent
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/forgot-password:
    post:
      summary: Request password reset link
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        '200':
          description: Password reset email sent (if account exists)
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/reset-password:
    post:
      summary: Reset password with token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: Password successfully reset
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/{provider}/login:
    post:
      summary: Social Login (Google/Facebook)
      tags: [Auth]
      description: |
        Authenticates a user via a social provider.

        **Developer Tools (Local Only):**
        To get a valid social token for testing, use our local Test UI:
        * **Google:** [http://localhost:3636/tools/google](http://localhost:3636/tools/google)
        * **Facebook:** [http://localhost:3636/tools/facebook](http://localhost:3636/tools/facebook)
      parameters:
        - in: path
          name: provider
          schema:
            type: string
            enum: [google, facebook]
          required: true
          description: OAuth provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginInput'
      responses:
        '200':
          description: Successfully authenticated via social provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ================= USER MODULE =================
  /users:
    get:
      summary: Get all users (paginated)
      tags: [User]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: keyword
          schema:
            type: string
            description: Search by name or email
        - in: query
          name: role
          schema:
            type: string
            enum: [USER, ADMIN]
      responses:
        '200':
          description: List of users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/stats:
    get:
      summary: Get user statistics (Admin)
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistical data
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    {
                      type: integer,
                      description: 'Total users (excluding deleted)',
                    }
                  active:
                    { type: integer, description: 'Users with status ACTIVE' }
                  restricted:
                    {
                      type: integer,
                      description: 'Total BANNED and DEACTIVE users',
                    }
                  verified:
                    { type: integer, description: 'Users with isVerified true' }
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me:
    get:
      summary: Get current authenticated user profile
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me/profile:
    patch:
      summary: Update current user profile
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      summary: Create a new user (Admin)
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{id}:
    get:
      summary: Get user by ID
      tags: [User]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: '65c3b1e8a1b2c3d4e5f6g7h8'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      summary: Update user
      description: |
        Updates a user's data. Permission logic:
        - **Self-Update (any role)**: Can update `name`, `email`, `phone`, `addresses`.
        - **Admin**: Can update `status`, `isVerified`, `password` for Users only. Cannot update Owners or other Admins.
        - **Owner**: Can update `status`, `isVerified`, `password`, and `role` for any user.
        - Personal info (`name`, `email`, `phone`, `addresses`) is **always ignored** when an Admin/Owner updates someone else.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                phone: { type: string, minLength: 10 }
                addresses:
                  type: array
                  items:
                    type: object
                    properties:
                      street: { type: string }
                      city: { type: string }
                      isDefault: { type: boolean }
                role:
                  {
                    type: string,
                    enum: [user, admin],
                    description: 'Owner only',
                  }
                status:
                  {
                    type: string,
                    enum: [active, deactive, banned, deleted],
                    description: 'Admin/Owner only',
                  }
                isVerified: { type: boolean, description: 'Admin/Owner only' }
                password:
                  {
                    type: string,
                    minLength: 6,
                    description: 'Admin/Owner only',
                  }
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/email/{email}:
    get:
      summary: Get user by Email
      tags: [User]
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/phone/{phone}:
    get:
      summary: Get user by Phone
      tags: [User]
      parameters:
        - in: path
          name: phone
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ================= CATEGORY MODULE =================
  /categories:
    get:
      summary: Get all categories (paginated & filtered)
      tags: [Category]
      parameters:
        - in: query
          name: path
          schema: { type: string, nullable: true }
          description: Filter by parent path
        - in: query
          name: level
          schema: { type: integer }
          description: Filter by exact level
        - in: query
          name: keyword
          schema: { type: string }
          description: Search by name
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of categories with pagination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListResponse' }
        'errorCode':
          description: Throw Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /categories/discovery:
    get:
      summary: Get Shallow Tree for discovery (L1 + top 20 L2)
      tags: [Category]
      responses:
        '200':
          description: Initial discovery tree (Redis Cached)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: 'success' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }

  /categories/{id}:
    get:
      summary: Get category by ID
      tags: [Category]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h7' }
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }

  /admin/categories:
    post:
      summary: Create category
      tags: [Category]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }

  /admin/categories/{id}:
    patch:
      summary: Update category properties (non-hierarchy)
      tags: [Category]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }

  /admin/categories/{id}/move:
    patch:
      summary: Move category to a new parent (Tree reorganization)
      tags: [Category]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentPath, version]
              properties:
                parentPath:
                  { type: string, nullable: true, example: ',id1,id2,' }
                version: { type: integer, example: 1 }
      responses:
        '200':
          description: Category moved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400':
          description: Invalid move operation (Self-parenting or Max depth)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      summary: Delete category by ID
      tags: [Category]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Category deleted

  # ================= BRAND MODULE =================
  /brands:
    get:
      summary: Get all brands
      tags: [Brand]
      responses:
        '200':
          description: List of brands

  /brands/{id}:
    get:
      summary: Get brand by ID
      tags: [Brand]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h9' }
      responses:
        '200':
          description: Brand details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandResponse' }

  /admin/brands:
    post:
      summary: Create brand
      tags: [Brand]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Brand created

  /admin/brands/{id}:
    put:
      summary: Update brand by ID
      tags: [Brand]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Brand updated

    delete:
      summary: Delete brand by ID
      tags: [Brand]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Brand deleted

  # ================= PRODUCT MODULE =================
  /products:
    get:
      summary: Get all products
      tags: [Product]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }

  /products/{id}:
    get:
      summary: Get product by ID
      tags: [Product]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h8' }
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }

  /admin/products:
    post:
      summary: Create product
      tags: [Product]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductInput' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /admin/products/{id}:
    put:
      summary: Update product
      tags: [Product]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Product updated

    delete:
      summary: Soft delete product
      tags: [Product]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product soft-deleted successfully

  # ================= SKU MODULE =================
  /skus/{id}:
    get:
      summary: Get SKU by ID
      tags: [Sku]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7i1' }
      responses:
        '200':
          description: SKU details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuResponse' }

  /products/{productId}/skus:
    get:
      summary: Get SKUs by Product ID
      tags: [Sku]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h8' }
      responses:
        '200':
          description: List of SKUs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuListResponse' }

  /admin/skus/{id}:
    put:
      summary: Update SKU details
      tags: [Sku]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: SKU updated

    delete:
      summary: Soft delete SKU
      tags: [Sku]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SKU deleted

  /admin/skus/{id}/price:
    patch:
      summary: Update SKU price
      tags: [Sku]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                basePrice: { type: number }
                salePrice: { type: number, nullable: true }
      responses:
        '200':
          description: SKU price updated

  # ================= INVENTORY MODULE =================
  /inventory/reserve:
    post:
      summary: Reserve stock for order
      tags: [Inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, quantity]
              properties:
                skuId: { type: string }
                quantity: { type: integer, example: 1 }
      responses:
        '200':
          description: Stock reserved
        '400':
          description: Insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /inventory/release:
    post:
      summary: Release reserved stock
      tags: [Inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, quantity]
              properties:
                skuId: { type: string }
                quantity: { type: integer, example: 1 }
      responses:
        '200':
          description: Stock released
        '400':
          description: Failed to release stock

  /inventory/{skuId}/add:
    patch:
      summary: Add stock quantity (Admin only)
      tags: [Inventory]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: skuId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, example: 10 }
      responses:
        '200':
          description: Stock added successfully

  /inventory/{skuId}:
    get:
      summary: Get inventory by SKU ID
      tags: [Inventory]
      parameters:
        - in: path
          name: skuId
          required: true
          schema: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7i1' }
      responses:
        '200':
          description: Inventory details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- AUTH INPUTS ---
    SignUpInput:
      type: object
      required: [email, password, name]
      properties:
        name: { type: string, example: 'John Doe' }
        email: { type: string, format: email, example: 'john@example.com' }
        password:
          { type: string, format: password, minLength: 6, example: 'secret123' }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: 'john@example.com' }
        password: { type: string, format: password, example: 'secret123' }

    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, example: 'eyJhbGciOiJIUz...' }

    LogoutInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, example: 'eyJhbGciOiJIUz...' }

    ResendVerificationInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: 'john@example.com' }

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: 'john@example.com' }

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, example: 'abc123token...' }
        newPassword:
          {
            type: string,
            format: password,
            minLength: 6,
            example: 'newSecret123',
          }

    SocialLoginInput:
      type: object
      required: [token]
      properties:
        token:
          {
            type: string,
            description: 'Provider ID Token (Legacy) or Access Token (OAuth2 - Recommended)',
          }

    # --- USER INPUTS ---
    CreateUserInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: 'Alice Smith' }
        email: { type: string, format: email, example: 'alice@example.com' }
        password: { type: string, minLength: 6, example: 'password123' }
        phone: { type: string, example: '0912345678' }
        role:
          {
            type: string,
            enum: [USER, ADMIN],
            default: 'USER',
            example: 'USER',
          }
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/UserAddress'

    UserUpdateInput:
      type: object
      properties:
        name: { type: string, example: 'Alice Smith' }
        phone: { type: string, example: '0987654321' }
        avatar: { type: string, example: 'https://example.com/avatar.jpg' }
        status:
          { type: string, enum: [active, deactive, banned], example: 'active' }

    UserAddress:
      type: object
      properties:
        street: { type: string, example: '123 Main St' }
        city: { type: string, example: 'Hanoi' }
        isDefault: { type: boolean, example: true }

    # --- BASE RESPONSES ---
    MetaData:
      type: object
      properties:
        timestamp: { type: string, example: '2024-02-15T10:00:00.000Z' }
        version: { type: string, example: '1.0.0' }
        trace_id: { type: string, nullable: true, example: '12345-abcde' }
        execution_time: { type: string, nullable: true, example: '15.23ms' }
        pagination:
          type: object
          properties:
            total_items: { type: integer }
            total_pages: { type: integer }
            page: { type: integer }
            limit: { type: integer }

    SuccessResponse:
      type: object
      properties:
        status: { type: string, example: 'success' }
        code: { type: integer, example: 200 }
        message: { type: string, example: 'SUCCESS' }
        metadata: { $ref: '#/components/schemas/MetaData' }
        data: { type: object, nullable: true }

    ErrorResponse:
      type: object
      properties:
        status: { type: string, example: 'error' }
        statusCode:
          oneOf:
            - type: integer
            - type: string
          example: '400, 401, 403, 404, 409, 500'
        message: { type: string, example: 'ERROR_MESSAGE_HERE' }
        errors:
          type: array
          items:
            type: object
            additionalProperties: true

    # --- SPECIFIC RESPONSES ---
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                user: { $ref: '#/components/schemas/User' }
                tokens:
                  type: object
                  properties:
                    accessToken: { type: string }
                    refreshToken: { type: string }

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/User' }

    UserListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/User' }
            metadata:
              type: object
              properties:
                pagination:
                  type: object
                  properties:
                    total_items: { type: integer }
                    total_pages: { type: integer }
                    page: { type: integer }
                    limit: { type: integer }

    User:
      type: object
      properties:
        id: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h8' }
        name: { type: string, example: 'John Doe' }
        email: { type: string, example: 'john@example.com' }
        phone: { type: string, example: '0912345678' }
        role: { type: string, enum: [USER, ADMIN], example: 'USER' }
        status:
          {
            type: string,
            enum: [active, deactive, banned, deleted],
            example: 'active',
          }
        isVerified: { type: boolean, example: true }
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/UserAddress'
        createdAt:
          {
            type: string,
            format: date-time,
            example: '2024-02-15T10:00:00.000Z',
          }

    # --- PRODUCT INPUTS ---
    CreateProductInput:
      type: object
      required: [name, categoryId, brandId, skus]
      properties:
        name: { type: string, example: 'iPhone 15' }
        categoryId: { type: string, example: '65c3b1e...' }
        brandId: { type: string, example: '65c3b1e...' }
        description: { type: string, example: 'The latest iPhone model' }
        shortDescription: { type: string, example: 'iPhone 15 128GB' }
        thumbnail: { type: string, example: 'thumbnail_url.jpg' }
        status:
          { type: string, enum: [draft, active, inactive], default: draft }
        skus:
          type: array
          items:
            type: object
            required: [skuCode, name, price, stock]
            properties:
              skuCode: { type: string, example: 'IPHONE15-128-BLK' }
              name: { type: string, example: 'iPhone 15 128GB Black' }
              price:
                type: object
                required: [basePrice]
                properties:
                  basePrice: { type: number, example: 999 }
                  salePrice: { type: number, nullable: true }
              stock: { type: integer, example: 50 }
              attributes:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string, example: 'Color' }
                    value: { type: string, example: 'Black' }

    # --- CATEGORY SCHEMAS ---
    Category:
      type: object
      properties:
        id: { type: string, example: '65c3b1e...' }
        name: { type: string, example: 'Electronics' }
        slug: { type: string, example: 'electronics' }
        path: { type: string, example: ',65c3b1e...,65c3b1f...,' }
        level: { type: integer, example: 1 }
        status:
          {
            type: string,
            enum: [draft, published, hidden, discontinued],
            example: 'published',
          }
        description: { type: string, example: 'All kinds of gadgets' }
        icon: { type: string, example: 'laptop' }
        version: { type: integer, example: 0 }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }
          description: 'Only present in discovery response'

    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Category' }

    CategoryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Category' }

    # --- BRAND SCHEMAS ---
    Brand:
      type: object
      properties:
        id: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h9' }
        name: { type: string, example: 'Apple' }
        slug: { type: string, example: 'apple' }
        description: { type: string, example: 'Premium electronics brand' }
        logo: { type: string, example: 'https://example.com/apple-logo.png' }
        status: { type: string, enum: [active, inactive], example: 'active' }

    BrandResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Brand' }

    BrandListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Brand' }

    # --- SKU SCHEMAS ---
    SkuPriceHistory:
      type: object
      properties:
        basePrice: { type: number, example: 999 }
        salePrice: { type: number, example: 899, nullable: true }
        type: { type: string, example: 'MANUAL' }
        reason: { type: string, example: 'Holiday discount' }
        appliedAt:
          {
            type: string,
            format: date-time,
            example: '2024-02-15T10:00:00.000Z',
          }

    Sku:
      type: object
      properties:
        id: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7i1' }
        productId: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h8' }
        skuCode: { type: string, example: 'IPHONE15-128-BLK' }
        name: { type: string, example: 'iPhone 15 128GB Black' }
        price:
          type: object
          properties:
            basePrice: { type: number, example: 999 }
            salePrice: { type: number, example: 899, nullable: true }
        priceHistory:
          type: array
          items: { $ref: '#/components/schemas/SkuPriceHistory' }
        attributes:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: 'Color' }
              value: { type: string, example: 'Black' }

    SkuResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Sku' }

    SkuListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Sku' }

    # --- PRODUCT SCHEMAS ---
    Product:
      type: object
      properties:
        id: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h8' }
        name: { type: string, example: 'iPhone 15' }
        slug: { type: string, example: 'iphone-15' }
        brandId: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h9' }
        categoryId: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7h7' }
        description: { type: string, example: 'The latest iPhone model' }
        status: { type: string, example: 'active' }
        avgRating: { type: number, example: 4.5 }
        totalReviews: { type: number, example: 120 }

    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Product' }

    ProductListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Product' }

    # --- INVENTORY SCHEMAS ---
    Inventory:
      type: object
      properties:
        skuId: { type: string, example: '65c3b1e8a1b2c3d4e5f6g7i1' }
        quantity: { type: integer, example: 100 }
        reserved: { type: integer, example: 5 }
        available: { type: integer, example: 95 }
        lowStockThreshold: { type: integer, example: 10 }
        location: { type: string, example: 'Warehouse A-12' }

    InventoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Inventory' }
