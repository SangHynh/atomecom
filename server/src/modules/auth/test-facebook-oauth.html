<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Atomecom OAuth Facebook Test</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #3b5998; margin: 0; color: white; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; width: 100%; max-width: 500px; color: #2d3436; }
        .token-box { margin-top: 20px; padding: 15px; background: #2d3436; color: #74b9ff; border-radius: 6px; word-break: break-all; text-align: left; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; display: none; }
        .fb-btn { background: #1877F2; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .copy-btn { margin-top: 10px; background: #00b894; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Atomecom Facebook Auth</h1>
        <p>Login to get <b>Access Token</b></p>
        
        <button class="fb-btn" onclick="checkLoginState()">Login with Facebook</button>

        <div id="tokenResult" class="token-box"></div>
        <button id="copyBtn" class="copy-btn" onclick="copyToken()">Copy Access Token</button>
    </div>

    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId      : 'YOUR_FACEBOOK_APP_ID',
                cookie     : true,
                xfbml      : true,
                version    : 'v18.0'
            });
        };

        function checkLoginState() {
            FB.login(function(response) {
                if (response.status === 'connected') {
                    const token = response.authResponse.accessToken;
                    displayToken(token);
                } else {
                    alert('User cancelled login or did not fully authorize.');
                }
            }, {scope: 'public_profile,email'});
        }

        function displayToken(token) {
            const tokenBox = document.getElementById('tokenResult');
            const copyBtn = document.getElementById('copyBtn');
            tokenBox.innerText = token;
            tokenBox.style.display = 'block';
            copyBtn.style.display = 'inline-block';
        }

        function copyToken() {
            const token = document.getElementById('tokenResult').innerText;
            navigator.clipboard.writeText(token).then(() => {
                alert("Facebook Token copied!");
            });
        }
    </script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</body>
</html>
